name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests + debug APK
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: anylap-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared code for iOS
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/AnyLap.xcodeproj -scheme AnyLap \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -50
          test ${PIPESTATUS[0]} -eq 0
