name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the test-build pre-release below

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build number into the app
        run: |
          v="$(grep '^appVersionName=' gradle.properties | cut -d= -f2)"
          sed -i -e "s/const val BUILD = 0/const val BUILD = ${GITHUB_RUN_NUMBER}/" -e "s/const val VERSION = \"dev\"/const val VERSION = \"$v\"/" composeApp/src/commonMain/kotlin/app/anylap/BuildInfo.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests + debug APK
        shell: bash
        run: |
          status=0
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --continue > gradle-android.log 2>&1 || status=$?
          tail -60 gradle-android.log
          # Compiler errors and failed tests as annotations (readable through the GitHub API).
          { grep -E '^e: ' gradle-android.log | sed -E 's#^e: file://[^ ]*/composeApp/src/([^:]+):([0-9]+):([0-9]+) (.*)#\1:\2:\3 \4#'; \
            grep -E -A2 ' FAILED$' gradle-android.log; grep -E -A3 'What went wrong' gradle-android.log; } | grep -v '^--$' | head -30 \
            | awk '{ lvl = (NR<=10) ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0 }' || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anylap-screenshots
          path: composeApp/screenshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: anylap-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
      # The test branch's newest APK as the pre-release "test-latest": the app offers it at start
      # (fixed test key + run number as versionCode → installs over the old one, data kept).
      - name: Publish test build
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'feature/footprint')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=anylap-test-${GITHUB_RUN_NUMBER}.apk
          cp composeApp/build/outputs/apk/debug/*.apk "$apk"
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "AnyLap test build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s) (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})"

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared code for iOS
        shell: bash
        run: |
          status=0
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --continue > gradle-ios.log 2>&1 || status=$?
          tail -60 gradle-ios.log
          # Surface compiler errors as annotations (readable through the GitHub API).
          # (10 errors + 10 warnings + 10 notices per step are kept by GitHub, so spread them.)
          grep -E '^e: ' gradle-ios.log | head -30 | sed -E 's#^e: file://[^ ]*/composeApp/src/([^:]+):([0-9]+):([0-9]+) (.*)#\1:\2:\3 \4#' \
            | awk '{ lvl = (NR<=10) ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0 }' || true
          exit $status
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build iOS app (simulator, unsigned)
        shell: bash
        run: |
          status=0
          xcodebuild -project iosApp/AnyLap.xcodeproj -scheme AnyLap \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > xcode.log 2>&1 || status=$?
          tail -80 xcode.log
          grep -E -A4 'error:|^e: |What went wrong' xcode.log | grep -v '^--$' | head -30 \
            | awk '{ lvl = (NR<=10) ? "error" : (NR<=20 ? "warning" : "notice"); print "::" lvl "::" $0 }' || true
          exit $status
