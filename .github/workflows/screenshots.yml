name: Screenshots

# Renders the real screens (Roborazzi) and commits the PNGs back to the branch,
# so they can be framed into store images without downloading CI artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["store/**"]
    paths-ignore: ["composeApp/screenshots/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: ./gradlew :composeApp:testDebugUnitTest --tests '*ScreenshotTest*' --stacktrace
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/screenshots
          git diff --cached --quiet || git commit -m "Update rendered screenshots [skip ci]"
          git push
