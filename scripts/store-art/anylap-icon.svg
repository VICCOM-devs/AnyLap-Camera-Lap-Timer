  <path fill="#2A0508" fill-opacity=".08" d="M56,30h6v6h-6z M50,36h6v6h-6z M56,42h6v6h-6z M50,48h6v6h-6z M56,54h6v6h-6z M50,60h6v6h-6z M56,66h6v6h-6z M50,72h6v6h-6z"/>
