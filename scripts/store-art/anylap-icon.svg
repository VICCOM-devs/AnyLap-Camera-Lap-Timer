<linearGradient id="lo" x1="0" x2="1"><stop offset="0" stop-color="#8E0300"/><stop offset=".3" stop-color="#B00500"/><stop offset="1" stop-color="#E10600"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".8"/></filter>
<clipPath id="stripclip"><rect x="50" y="30" width="12" height="48"/></clipPath>
