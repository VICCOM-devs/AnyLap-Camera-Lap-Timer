<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86090E"/><stop offset=".55" stop-color="#3A060A"/><stop offset="1" stop-color="#0E0607"/></linearGradient>
<radialGradient id="glow" cx="22%" cy="16%" r="70%"><stop offset="0" stop-color="#D0141A" stop-opacity=".55"/><stop offset="1" stop-color="#D0141A" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
<linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DADAE0"/></linearGradient>
<linearGradient id="strip" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".22" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".30"/></linearGradient>
