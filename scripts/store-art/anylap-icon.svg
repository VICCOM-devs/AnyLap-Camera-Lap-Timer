  <path fill="url(#white)" d="M50,30h6v6h-6z M56,36h6v6h-6z M50,42h6v6h-6z M56,48h6v6h-6z M50,54h6v6h-6z M56,60h6v6h-6z M50,66h6v6h-6z M56,72h6v6h-6z"/>
