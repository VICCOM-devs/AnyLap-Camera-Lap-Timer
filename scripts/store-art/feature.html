<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BI;src:url(../../composeApp/src/commonMain/composeResources/font/barlow_black_italic.ttf)}
@font-face{font-family:S;src:url(../../composeApp/src/commonMain/composeResources/font/barlow_semi_bold.ttf)}
@font-face{font-family:B;src:url(../../composeApp/src/commonMain/composeResources/font/barlow_bold.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;background:#09090B;font-family:S;color:#F6F6F8}
.photo{position:absolute;left:196px;top:-30px;width:996px;height:560px;background:url(../../composeApp/src/androidUnitTest/resources/store/track.jpg) center/cover;filter:saturate(1.05) contrast(1.08) brightness(.92)}
.tint{position:absolute;inset:0;background:
  linear-gradient(90deg,#09090B 0,#09090B 330px,rgba(9,9,11,.92) 420px,rgba(9,9,11,.35) 560px,rgba(9,9,11,0) 680px),
  linear-gradient(180deg,rgba(9,9,11,.75) 0,rgba(9,9,11,0) 38%,rgba(9,9,11,0) 70%,rgba(9,9,11,.7) 100%),
  radial-gradient(ellipse 520px 360px at 760px 300px,rgba(225,6,0,.0),rgba(120,4,8,.35))}
.glow{position:absolute;left:-160px;top:-180px;width:640px;height:640px;background:radial-gradient(circle,rgba(225,6,0,.38),transparent 62%)}
.line{position:absolute;left:700px;top:172px}
.knob{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008}
.knob:after{content:'';position:absolute;inset:7px;border-radius:50%;background:#E10600}
.ic{position:absolute;left:62px;top:86px;width:128px;height:128px;border-radius:30px;overflow:hidden;box-shadow:0 16px 40px #000c, 0 0 0 1.5px rgba(255,255,255,.08)}
.word{position:absolute;left:58px;top:228px;font-family:BI;font-size:104px;line-height:1;letter-spacing:-1px;text-transform:uppercase}
.word span{color:#FF2A1F}
.bar{position:absolute;left:64px;top:344px;width:110px;height:7px;background:#E10600;border-radius:2px}
.tag{position:absolute;left:64px;top:366px;font-size:30px;line-height:1.25;color:#D2D2D8}
.card{position:absolute;right:34px;top:30px;display:flex;align-items:stretch;border-radius:16px;overflow:hidden;background:rgba(20,20,24,.92);box-shadow:0 16px 40px #000b;border:1.5px solid rgba(255,255,255,.08)}
.pos{width:62px;background:#E10600;display:flex;align-items:center;justify-content:center;font-family:BI;font-size:46px}
.cbody{padding:10px 18px 10px 16px}
.meta{font-family:B;font-size:17px;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.meta b{font-family:BI;font-size:21px;letter-spacing:0}
.fl{background:#A855F7;color:#0B0B0D;font-size:13px;letter-spacing:1.5px;padding:3px 8px;border-radius:6px}
.time{font-family:BI;font-size:54px;line-height:1.02;color:#B26BFF}
.time small{font-family:S;font-size:20px;color:#C9C9D0;margin-left:10px}
