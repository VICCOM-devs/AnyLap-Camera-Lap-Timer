<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="robots" content="noindex">
<title>AnyLap Live</title>
<style>
  :root {
    --bg: #09090B; --surface: #131316; --surface2: #1C1C21; --stroke: #26262C;
    --text: #F6F6F8; --dim: #A1A1AA; --faint: #6B6B74;
    --accent: #E10600; --hot: #FF3B2F; --purple: #B15CFF; --gold: #F5C542; --green: #22C55E; --amber: #F5A524;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; background:
    radial-gradient(120% 60% at 50% -10%, rgba(225,6,0,.28), transparent 60%), var(--bg); }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 14px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand { font-weight: 900; font-style: italic; letter-spacing: .5px; font-size: 20px; }
  .brand span { color: var(--accent); }
  .pill { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 5px 9px; border-radius: 999px;
    background: rgba(225,6,0,.16); color: var(--hot); display: inline-flex; align-items: center; gap: 6px; }
  .pill.off { background: var(--surface2); color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
  .pill.off .dot { animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  .hero { border: 1px solid #7A0A0E; border-radius: 22px; padding: 16px 18px;
    background: linear-gradient(135deg, #3A080B, #1E0A0C 55%, var(--surface)); margin-bottom: 12px; }
  .title { font-size: 22px; font-weight: 900; font-style: italic; text-transform: uppercase; }
  .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .clock { font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 800; margin-top: 8px; letter-spacing: -.5px; }
  .tower { border: 1px solid var(--stroke); border-radius: 22px; background: var(--surface); overflow: hidden; }
  .head, .row { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 10px; padding: 0 12px; }
  .head { color: var(--faint); font-size: 10px; letter-spacing: 1px; font-weight: 700; padding-top: 10px; padding-bottom: 6px; }
  .row { padding-top: 10px; padding-bottom: 10px; border-top: 1px solid var(--stroke); position: relative; }
  .row::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
  .pos { font-weight: 900; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  .p1 .pos { color: var(--gold); }
  .name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { display: inline-block; min-width: 26px; padding: 1px 6px; margin-right: 6px; border-radius: 6px; font-size: 12px; font-weight: 800;
    background: var(--c); color: #000; text-align: center; }
  .sub { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .sub .fl { color: var(--purple); font-weight: 700; }
  .right { text-align: right; font-variant-numeric: tabular-nums; }
  .gap { font-weight: 800; font-size: 15px; }
  .laps { color: var(--dim); font-size: 12px; }
  .chk { color: var(--green); font-weight: 800; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(225,6,0,.25); } to { background: transparent; } }
  .card { border: 1px solid var(--stroke); border-radius: 22px; background: var(--surface); padding: 22px; text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { color: var(--dim); margin: 0 0 14px; }
  input { width: 100%; font-size: 28px; letter-spacing: 6px; text-align: center; text-transform: uppercase; padding: 12px;
    border-radius: 14px; border: 1px solid var(--stroke); background: var(--surface2); color: var(--text); font-weight: 800; }
  button { margin-top: 12px; width: 100%; padding: 15px; border: 0; border-radius: 16px; font-weight: 900; letter-spacing: 1px;
    color: #fff; background: linear-gradient(90deg, var(--hot), var(--accent), #B80500); font-size: 15px; text-transform: uppercase; }
  footer { color: var(--faint); font-size: 12px; text-align: center; margin-top: 18px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Any<span>Lap</span> Live</div>
    <div id="status" class="pill off"><span class="dot"></span><span id="statusText">—</span></div>
  </header>
  <div id="app"></div>
  <footer><span id="foot"></span> · <a href="https://viccom.se">viccom.se</a></footer>
</main>
<script>
(() => {
  const SUPABASE_URL = "https://ecdkjmvfjusznvggzvfs.supabase.co";
  const KEY = "sb_publishable_luYMNaJjBpzYM2fhzmBMZw_xPcR_hon"; // publishable key: read-only, public by design
  const POLL_MS = 2000;

  const sv = (navigator.language || "").toLowerCase().startsWith("sv");
  const T = sv ? {
    live: "LIVE", waiting: "VÄNTAR", finished: "MÅL", offline: "OFFLINE",
    enter: "Ange kod", enterBody: "Koden visas på telefonen som tar tiden.", follow: "Följ loppet",
    notFound: "Ingen livetiming med den koden", notFoundBody: "Kontrollera koden – den gäller i 12 timmar.",
    pos: "POS", racer: "FÖRARE · SENASTE VARV", gap: "LUCKA", best: "BÄSTA",
    lap: "varv", laps: "varv", lapsTo: (n) => `Först till ${n} varv`, timed: (m) => `${m} minuter`, practice: "Träning",
    ready: "Startar snart…", foot: "Tidtagning med AnyLap – kamera-varvräknare", leader: "Ledare",
  } : {
    live: "LIVE", waiting: "WAITING", finished: "FINISHED", offline: "OFFLINE",
    enter: "Enter code", enterBody: "The code is shown on the phone doing the timing.", follow: "Follow the race",
    notFound: "No live timing with that code", notFoundBody: "Check the code – it works for 12 hours.",
    pos: "POS", racer: "RACER · LAST LAP", gap: "GAP", best: "BEST",
    lap: "lap", laps: "laps", lapsTo: (n) => `First to ${n} laps`, timed: (m) => `${m} minutes`, practice: "Practice",
    ready: "Starting soon…", foot: "Timed with AnyLap – camera lap timer", leader: "Leader",
  };
  document.documentElement.lang = sv ? "sv" : "en";
  document.getElementById("foot").textContent = T.foot;

  const $app = document.getElementById("app");
  const $status = document.getElementById("status");
  const $statusText = document.getElementById("statusText");
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lap = (ms) => {
    if (ms == null) return "—";
    const m = Math.floor(ms / 60000), s = ((ms % 60000) / 1000).toFixed(3);
    return m > 0 ? `${m}:${s.padStart(6, "0")}` : s;
  };
  const clock = (ms) => {
    ms = Math.max(0, ms);
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  };
  const setStatus = (text, on) => { $statusText.textContent = text; $status.classList.toggle("off", !on); };

  if (!code) {
    setStatus("—", false);
    $app.innerHTML = `<div class="card"><h2>${T.enter}</h2><p>${T.enterBody}</p>
      <form id="f"><input id="c" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123" inputmode="text">
      <button type="submit">${T.follow}</button></form></div>`;
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("c").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (v.length === 6) location.search = "?c=" + v;
    });
    return;
  }

  let snap = null, fetchedAt = 0, serverLag = 0, lastLaps = {}, failures = 0;

  async function poll() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/anylap_live_get`, {
        method: "POST",
        headers: { apikey: KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_code: code }),
        cache: "no-store",
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      failures = 0;
      if (!data) { snap = null; renderNotFound(); return; }
      if (data.updated_at) serverLag = Date.now() - Date.parse(data.updated_at);
      snap = data; fetchedAt = Date.now();
      render();
    } catch (e) {
      failures++;
      if (failures > 2) setStatus(T.offline, false);
    } finally {
      setTimeout(poll, document.hidden ? POLL_MS * 3 : POLL_MS);
    }
  }

  function renderNotFound() {
    setStatus("—", false);
    $app.innerHTML = `<div class="card"><h2>${T.notFound}</h2><p>${T.notFoundBody}</p>
      <button onclick="location.search=''">${T.enter}</button></div>`;
  }

  function format(s) {
    if (s.mode === "LAPS") return T.lapsTo(s.targetLaps);
    if (s.mode === "TIME") return T.timed(Math.round(s.timeLimitSec / 60));
    return T.practice;
  }

  function elapsed() {
    if (!snap) return 0;
    let ms = snap.elapsedMs || 0;
    // While running, extrapolate from when the phone last wrote.
    if (snap.phase === "RUNNING") ms += Math.min(10000, Math.max(0, serverLag)) + (Date.now() - fetchedAt);
    if (snap.mode === "TIME") return Math.max(0, snap.timeLimitSec * 1000 - ms);
    return ms;
  }

  function render() {
    const s = snap;
    const running = s.phase === "RUNNING" || s.phase === "COUNTDOWN";
    setStatus(s.phase === "FINISHED" ? T.finished : running ? T.live : T.waiting, running);
    const isRace = s.mode !== "PRACTICE";
    const rows = (s.rows || []).slice().sort((a, b) => a.pos - b.pos);
    const fresh = {};
    const body = rows.map((r) => {
      const key = r.name + "#" + r.number;
      const flashed = lastLaps[key] != null && lastLaps[key] !== r.laps;
      fresh[key] = r.laps;
      const right = isRace
        ? `<div class="gap">${r.finished ? '<span class="chk">✓</span> ' : ""}${esc(r.pos === 1 ? (r.finished ? "" : T.leader) : r.gap)}</div><div class="laps">${r.laps} ${r.laps === 1 ? T.lap : T.laps}</div>`
        : `<div class="gap ${r.fastest ? "fl" : ""}" style="${r.fastest ? "color:var(--purple)" : ""}">${lap(r.bestMs)}</div><div class="laps">${r.laps} ${r.laps === 1 ? T.lap : T.laps}</div>`;
      return `<div class="row ${r.pos === 1 ? "p1" : ""} ${flashed ? "flash" : ""}" style="--c:${esc(r.color)}">
        <div class="pos">${r.pos}</div>
        <div><div class="name"><span class="num">${esc(r.number)}</span>${esc(r.name)}</div>
          <div class="sub">${lap(r.lastMs)}${isRace && r.bestMs != null ? ` · <span class="${r.fastest ? "fl" : ""}">${T.best.toLowerCase()} ${lap(r.bestMs)}</span>` : ""}${r.speed != null ? ` · ${Math.round(r.speed)} ${esc(s.speedUnit)}` : ""}</div></div>
        <div class="right">${right}</div></div>`;
    }).join("");
    lastLaps = fresh;
    $app.innerHTML = `
      <div class="hero"><div class="title">${esc(s.title)}</div>
        <div class="meta">${esc(format(s))}${isRace && s.mode === "LAPS" && s.leaderLaps ? ` · ${T.leader.toLowerCase()} ${s.leaderLaps}/${s.targetLaps}` : ""}</div>
        <div class="clock" id="clock">${s.phase === "SETUP" ? T.ready : clock(elapsed())}</div></div>
      <div class="tower"><div class="head"><div>${T.pos}</div><div>${T.racer}</div><div>${isRace ? T.gap : T.best}</div></div>${body}</div>`;
  }

  setInterval(() => {
    const el = document.getElementById("clock");
    if (el && snap && snap.phase === "RUNNING") el.textContent = clock(elapsed());
  }, 250);

  setStatus("…", false);
  poll();
})();
</script>
</body>
</html>
